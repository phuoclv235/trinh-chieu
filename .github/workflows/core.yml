name: core

on:
  push:
  pull_request:

concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v4
      # LibraryIndex dùng GRDB, cần SQLite hệ thống (có sẵn FTS5) để build trên Linux.
      - name: Cài SQLite
        run: apt-get update -qq && apt-get install -y -qq libsqlite3-dev
      # hashFiles() không chạy được trong container, nên tính mã băm bằng shell.
      - name: Tính khoá cache
        id: cachekey
        run: echo "hash=$(find Packages -maxdepth 2 \( -name Package.swift -o -name Package.resolved \) | sort | xargs sha256sum | sha256sum | cut -c1-32)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: Packages/TrinhChieuCore/.build
          key: core-build-${{ runner.os }}-${{ steps.cachekey.outputs.hash }}
          restore-keys: |
            core-build-${{ runner.os }}-
      - name: Kiểm nhanh
        run: scripts/check.sh --quick
      - name: Test lặp 3 lần và độ phủ CoreModel/Show
        if: always()
        run: scripts/coverage.sh Sources/CoreModel/Show 90
