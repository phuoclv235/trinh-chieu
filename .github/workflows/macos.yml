name: macos

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    # Chỉ chạy khi PR không còn nháp, hoặc khi đẩy vào main.
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Cài XcodeGen
        run: brew install xcodegen
      - name: Kiểm đầy đủ
        run: scripts/check.sh --full
        env:
          TRINHCHIEU_GOLDEN_OUTPUT: ${{ runner.temp }}/anh-test-render
      # Ảnh thật của test ảnh RenderEngine khi lệch hoặc thiếu ảnh chuẩn, để xem và so.
      - name: Tải ảnh test render
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anh-test-render
          path: ${{ runner.temp }}/anh-test-render
          if-no-files-found: ignore
